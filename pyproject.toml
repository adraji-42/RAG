[project]
name = "RAG"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fire>=0.7.1",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.5",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "types-tqdm>=4.70.0.20260906",
]

[tool.mypy]
ignore_missing_imports = true
